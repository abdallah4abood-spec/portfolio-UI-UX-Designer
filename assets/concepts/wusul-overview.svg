<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="title desc">
  <title id="title">Wusul responsive public-service application tracker — concept overview</title>
  <desc id="desc">Concept design visualization of a responsive application tracker with a desktop task list, a mobile evidence upload screen, and a check-your-answers screen using clear plain language.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#18334B" flood-opacity="0.11"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .navy { fill: #18334B; }
      .teal { fill: #197565; }
      .muted { fill: #62727B; }
      .white { fill: #FFFFFF; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; }
      .small { font-size: 16px; }
      .body { font-size: 19px; }
      .semibold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F8F6EF"/>
  <rect x="0" y="0" width="1440" height="154" fill="#FFFFFF"/>
  <rect x="0" y="0" width="14" height="154" fill="#F4C95D"/>
  <circle cx="1375" cy="905" r="125" fill="#F4C95D" opacity="0.16"/>

  <g aria-label="Proof sheet heading">
    <rect x="60" y="38" width="52" height="52" rx="14" fill="#18334B"/>
    <path d="M73 54l9 21 9-14 9 14 8-21" fill="none" stroke="#F4C95D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="57" class="label teal">WUSUL / APPLICATION TRACKER</text>
    <text x="128" y="98" font-size="34" font-weight="700" class="navy">Know what is done, what is missing, and what comes next.</text>
    <rect x="1110" y="20" width="270" height="38" rx="19" fill="#18334B"/>
    <text x="1245" y="44" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" class="white">CONCEPT · ILLUSTRATIVE DATA</text>
    <text x="60" y="135" font-size="19" class="muted">A responsive service pattern with task status, evidence guidance and reversible review.</text>
  </g>

  <g aria-label="Screen labels">
    <text x="60" y="190" class="label teal">01 · DESKTOP TASK LIST</text>
    <text x="770" y="190" class="label teal">02 · MOBILE EVIDENCE</text>
    <text x="1090" y="190" class="label teal">03 · CHECK YOUR ANSWERS</text>
  </g>

  <!-- Desktop task list -->
  <g aria-label="Desktop application task list">
    <rect x="60" y="210" width="680" height="675" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M60 236a26 26 0 0 1 26-26h628a26 26 0 0 1 26 26v48H60z" fill="#18334B"/>
    <text x="88" y="257" font-size="26" font-weight="700" class="white">wusul</text>
    <circle cx="171" cy="247" r="5" fill="#F4C95D"/>
    <text x="440" y="252" font-size="16" fill="#DCE5E6">Application tracker</text>
    <text x="712" y="252" text-anchor="end" font-size="16" font-weight="700" fill="#F4C95D">Save and exit</text>

    <rect x="60" y="284" width="156" height="601" fill="#F1F3EF"/>
    <text x="84" y="327" class="muted" font-size="12" font-weight="700" letter-spacing="1">YOUR APPLICATION</text>
    <rect x="76" y="349" width="124" height="44" rx="10" fill="#DCEBE5"/>
    <text x="90" y="377" font-size="16" font-weight="700" class="teal">Tasks</text>
    <text x="90" y="426" font-size="16" class="muted">Saved answers</text>
    <text x="90" y="474" font-size="16" class="muted">Get help</text>
    <rect x="84" y="791" width="108" height="62" rx="12" fill="#FFFFFF"/>
    <text x="96" y="816" font-size="14" font-weight="700" class="navy">Need more time?</text>
    <text x="96" y="839" font-size="13" class="muted">Answers are saved.</text>

    <text x="244" y="329" class="label teal">COMMUNITY HOUSING SUPPORT</text>
    <text x="244" y="369" font-size="31" font-weight="700" class="navy">Complete your application</text>
    <text x="244" y="398" class="body muted">You can finish the tasks in any order.</text>

    <rect x="244" y="426" width="468" height="102" rx="16" fill="#FFFFFF" stroke="#D8DEDC" stroke-width="2"/>
    <circle cx="277" cy="461" r="17" fill="#197565"/>
    <path d="M269 461l6 6 11-13" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="307" y="460" font-size="22" font-weight="700" class="navy">Personal details</text>
    <text x="307" y="487" font-size="17" class="muted">Name, date of birth and contact details</text>
    <rect x="592" y="443" width="100" height="30" rx="15" fill="#DCEBE5"/>
    <text x="642" y="463" text-anchor="middle" font-size="15" font-weight="700" class="teal">Complete</text>
    <text x="692" y="505" text-anchor="end" font-size="15" font-weight="700" class="teal">Review</text>

    <rect x="244" y="544" width="468" height="116" rx="16" fill="#FFFFFF" stroke="#197565" stroke-width="2"/>
    <circle cx="277" cy="580" r="17" fill="#F4C95D"/>
    <text x="277" y="586" text-anchor="middle" font-size="17" font-weight="700" class="navy">2</text>
    <text x="307" y="578" font-size="22" font-weight="700" class="navy">Evidence</text>
    <text x="307" y="605" font-size="17" class="muted">2 of 4 requested items added</text>
    <rect x="570" y="558" width="122" height="30" rx="15" fill="#FFF1C9"/>
    <text x="631" y="578" text-anchor="middle" font-size="15" font-weight="700" fill="#705615">In progress</text>
    <rect x="307" y="625" width="196" height="8" rx="4" fill="#E5E8E3"/>
    <rect x="307" y="625" width="98" height="8" rx="4" fill="#197565"/>
    <text x="692" y="635" text-anchor="end" font-size="15" font-weight="700" class="teal">Continue</text>

    <rect x="244" y="676" width="468" height="92" rx="16" fill="#FFFFFF" stroke="#D8DEDC" stroke-width="2"/>
    <circle cx="277" cy="711" r="17" fill="#E8EBE7"/>
    <text x="277" y="717" text-anchor="middle" font-size="17" font-weight="700" class="muted">3</text>
    <text x="307" y="710" font-size="22" font-weight="700" class="navy">Review</text>
    <text x="307" y="738" font-size="17" class="muted">Check your answers before you submit</text>
    <rect x="575" y="692" width="117" height="30" rx="15" fill="#EEF0ED"/>
    <text x="633" y="712" text-anchor="middle" font-size="15" font-weight="700" class="muted">Not started</text>

    <rect x="244" y="798" width="218" height="54" rx="12" fill="#197565"/>
    <text x="353" y="832" text-anchor="middle" font-size="19" font-weight="700" class="white">Continue application</text>
    <text x="712" y="819" text-anchor="end" font-size="15" class="muted">Last saved on this device</text>
    <text x="712" y="843" text-anchor="end" font-size="15" class="muted">Illustrative draft</text>
  </g>

  <!-- Mobile evidence -->
  <g aria-label="Mobile evidence upload screen">
    <rect x="770" y="210" width="290" height="675" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="770" y="210" width="290" height="6" rx="3" fill="#F4C95D"/>
    <text x="794" y="244" font-size="15" font-weight="700" class="navy">9:41</text>
    <path d="M1006 238h6v6h-6zM1016 235h6v9h-6zM1026 232h6v12h-6z" fill="#18334B"/>
    <text x="794" y="282" font-size="23" font-weight="700" class="navy">wusul</text>
    <text x="1036" y="281" text-anchor="end" font-size="15" font-weight="700" class="teal">Save and exit</text>
    <path d="M809 306l-9 9 9 9" fill="none" stroke="#197565" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="831" y="321" font-size="16" font-weight="700" class="teal">Back to tasks</text>

    <text x="794" y="365" font-size="28" font-weight="700" class="navy">Add your evidence</text>
    <text x="794" y="394" class="body muted">2 of 4 items added</text>
    <rect x="794" y="410" width="242" height="8" rx="4" fill="#E5E8E3"/>
    <rect x="794" y="410" width="121" height="8" rx="4" fill="#197565"/>

    <text x="794" y="459" font-size="20" font-weight="700" class="navy">Proof of address</text>
    <text x="794" y="486" class="small muted">Use a document that shows</text>
    <text x="794" y="508" class="small muted">your name and address.</text>
    <text x="794" y="537" class="small muted">PDF, JPG or PNG · Up to 10 MB</text>

    <rect x="794" y="559" width="242" height="110" rx="16" fill="#F8F6EF" stroke="#197565" stroke-width="2" stroke-dasharray="6 5"/>
    <circle cx="915" cy="587" r="17" fill="#DCEBE5"/>
    <path d="M915 595v-17m-7 7 7-7 7 7" fill="none" stroke="#197565" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="915" y="625" text-anchor="middle" font-size="19" font-weight="700" class="teal">Choose a file</text>
    <text x="915" y="650" text-anchor="middle" font-size="15" class="muted">or take a photo</text>

    <rect x="794" y="686" width="242" height="72" rx="14" fill="#EEF5F1"/>
    <rect x="808" y="700" width="38" height="44" rx="8" fill="#FFFFFF"/>
    <path d="M819 712h16m-16 8h16m-16 8h11" stroke="#197565" stroke-width="2" stroke-linecap="round"/>
    <text x="858" y="713" font-size="16" font-weight="700" class="navy">address-note.pdf</text>
    <text x="858" y="736" font-size="14" class="muted">1.2 MB · Added</text>
    <circle cx="1019" cy="721" r="10" fill="#197565"/>
    <path d="M1014 721l4 4 6-8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>

    <rect x="794" y="786" width="242" height="54" rx="12" fill="#197565"/>
    <text x="915" y="820" text-anchor="middle" font-size="19" font-weight="700" class="white">Continue</text>
    <text x="915" y="863" text-anchor="middle" font-size="14" class="muted">Your file stays with this draft</text>
  </g>

  <!-- Check answers -->
  <g aria-label="Mobile check your answers screen">
    <rect x="1090" y="210" width="290" height="675" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="1090" y="210" width="290" height="6" rx="3" fill="#197565"/>
    <text x="1114" y="244" font-size="15" font-weight="700" class="navy">9:41</text>
    <path d="M1326 238h6v6h-6zM1336 235h6v9h-6zM1346 232h6v12h-6z" fill="#18334B"/>
    <path d="M1129 272l-9 9 9 9" fill="none" stroke="#197565" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1151" y="287" font-size="16" font-weight="700" class="teal">Back</text>
    <text x="1114" y="338" font-size="28" font-weight="700" class="navy">Check your answers</text>
    <text x="1114" y="367" class="small muted">Change anything that is not right.</text>

    <text x="1114" y="410" font-size="19" font-weight="700" class="navy">Personal details</text>
    <text x="1356" y="410" text-anchor="end" font-size="16" font-weight="700" class="teal">Change</text>
    <line x1="1114" y1="424" x2="1356" y2="424" stroke="#D8DEDC"/>
    <text x="1114" y="451" class="small muted">Full name</text>
    <text x="1114" y="475" font-size="18" font-weight="700" class="navy">Samira Lee</text>
    <text x="1114" y="505" class="small muted">Date of birth</text>
    <text x="1114" y="529" font-size="18" font-weight="700" class="navy">14 May 1992</text>

    <text x="1114" y="574" font-size="19" font-weight="700" class="navy">Evidence</text>
    <text x="1356" y="574" text-anchor="end" font-size="16" font-weight="700" class="teal">Change</text>
    <line x1="1114" y1="588" x2="1356" y2="588" stroke="#D8DEDC"/>
    <text x="1114" y="615" class="small muted">Files added</text>
    <text x="1114" y="640" font-size="18" font-weight="700" class="navy">4 documents</text>
    <text x="1114" y="667" class="small muted">Including proof of address</text>

    <rect x="1114" y="693" width="242" height="71" rx="12" fill="#FFF6DB"/>
    <text x="1128" y="719" font-size="15" font-weight="700" class="navy">Before you submit</text>
    <text x="1128" y="742" font-size="14" class="muted">Check that your answers are</text>
    <text x="1128" y="760" font-size="14" class="muted">complete and correct.</text>

    <rect x="1114" y="786" width="242" height="54" rx="12" fill="#197565"/>
    <text x="1235" y="820" text-anchor="middle" font-size="18" font-weight="700" class="white">Accept and submit</text>
    <text x="1235" y="863" text-anchor="middle" font-size="14" class="muted">You can go back to make changes</text>
  </g>

  <text x="60" y="928" font-size="17" class="muted">Service content, names, files and progress are illustrative. No real authority or service is represented.</text>
  <text x="1380" y="928" text-anchor="end" font-size="17" font-weight="700" class="teal">WUSUL / RESPONSIVE OVERVIEW</text>
</svg>
