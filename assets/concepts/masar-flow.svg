<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="title desc">
  <title id="title">Masar download, offline work and sync flow — concept design</title>
  <desc id="desc">Concept design visualization of a detailed mobile flow from Download for offline to Work offline to Sync changes, including explicit device-only and uploading states, large touch targets, and an online, offline and syncing state matrix.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#30358F" flood-opacity="0.11"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #242756; }
      .muted { fill: #686B87; }
      .brand { fill: #30358F; }
      .white { fill: #FFFFFF; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1.5px; }
      .small { font-size: 16px; }
      .body { font-size: 19px; }
      .title { font-size: 29px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F6F7FC"/>
  <path d="M0 0h1440v150H0z" fill="#EEF1FF"/>
  <path d="M0 149h1440" stroke="#DDE2FA" stroke-width="2"/>

  <g aria-label="Proof sheet heading">
    <rect x="60" y="40" width="50" height="50" rx="15" fill="#30358F"/>
    <path d="M74 76V57l11 10 11-10v19" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="59" class="label brand">MASAR / CORE OFFLINE FLOW</text>
    <text x="126" y="99" font-size="34" font-weight="700" class="ink">Preparation is clear. Offline work is never ambiguous.</text>
    <rect x="1110" y="45" width="270" height="38" rx="19" fill="#30358F"/>
    <text x="1245" y="69" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" class="white">CONCEPT · ILLUSTRATIVE DATA</text>
    <text x="60" y="133" font-size="19" class="muted">Primary actions stay in place while connection and sync language changes.</text>
  </g>

  <g aria-label="Flow steps">
    <circle cx="79" cy="195" r="18" fill="#30358F"/>
    <text x="79" y="201" text-anchor="middle" font-size="17" font-weight="700" class="white">1</text>
    <text x="109" y="202" font-size="23" font-weight="700" class="brand">Download for offline</text>
    <circle cx="404" cy="195" r="18" fill="#30358F"/>
    <text x="404" y="201" text-anchor="middle" font-size="17" font-weight="700" class="white">2</text>
    <text x="434" y="202" font-size="23" font-weight="700" class="brand">Work offline</text>
    <circle cx="729" cy="195" r="18" fill="#30358F"/>
    <text x="729" y="201" text-anchor="middle" font-size="17" font-weight="700" class="white">3</text>
    <text x="759" y="202" font-size="23" font-weight="700" class="brand">Sync changes</text>
    <text x="1040" y="201" class="label brand">BEHAVIOUR ACROSS STATES</text>
  </g>

  <!-- Download for offline -->
  <g aria-label="Download for offline mobile screen">
    <rect x="60" y="230" width="290" height="620" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="84" y="264" font-size="15" font-weight="700" class="ink">9:41</text>
    <path d="M296 258h6v6h-6zM306 255h6v9h-6zM316 252h6v12h-6z" fill="#30358F"/>
    <circle cx="101" cy="303" r="20" fill="#EEF1FF"/>
    <path d="M106 293l-10 10 10 10" fill="none" stroke="#30358F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="355" class="label brand">BIOLOGY · LESSON 3</text>
    <text x="84" y="391" class="title ink">Cell systems</text>
    <text x="84" y="419" class="body muted">Reading, diagrams and quiz</text>

    <rect x="84" y="447" width="242" height="132" rx="20" fill="#EEF1FF"/>
    <path d="M105 473h26v30h-26zM110 468h16" fill="none" stroke="#7184FF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="145" y="480" font-size="18" font-weight="700" class="ink">Lesson pack</text>
    <text x="145" y="505" class="small muted">24 MB download</text>
    <line x1="104" y1="524" x2="306" y2="524" stroke="#D5DBF8"/>
    <text x="104" y="550" class="small muted">3 reading sections</text>
    <text x="104" y="571" class="small muted">1 five-question quiz</text>

    <rect x="84" y="605" width="242" height="58" rx="16" fill="#30358F"/>
    <path d="M110 625v15m-7-7 7 7 7-7M102 646h25" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="137" y="641" font-size="18" font-weight="700" class="white">Download for offline</text>
    <rect x="110" y="670" width="190" height="26" rx="13" fill="#EEF1FF"/>
    <text x="205" y="688" text-anchor="middle" font-size="13" font-weight="700" class="brand">56 PX PRIMARY TOUCH TARGET</text>
    <path d="M205 670v-7" stroke="#7184FF" stroke-width="2"/>

    <rect x="84" y="719" width="242" height="82" rx="16" fill="#F7F8FC"/>
    <text x="102" y="747" font-size="16" font-weight="700" class="ink">Before you download</text>
    <text x="102" y="772" class="small muted">Use Wi-Fi if you prefer.</text>
    <text x="102" y="792" class="small muted">You can remove it anytime.</text>
    <rect x="160" y="826" width="90" height="5" rx="2.5" fill="#30358F"/>
  </g>

  <!-- Arrow 1 -->
  <g aria-label="Next step">
    <circle cx="368" cy="531" r="16" fill="#B9E4CE"/>
    <path d="M361 531h13m-5-5 5 5-5 5" fill="none" stroke="#30358F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Work offline -->
  <g aria-label="Work offline mobile screen">
    <rect x="385" y="230" width="290" height="620" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="409" y="264" font-size="15" font-weight="700" class="ink">9:41</text>
    <path d="M610 255l18 9m-18 0 18-9" stroke="#8B8EA3" stroke-width="2" stroke-linecap="round"/>
    <rect x="409" y="283" width="242" height="38" rx="19" fill="#F1F2F6"/>
    <circle cx="430" cy="302" r="5" fill="#8B8EA3"/>
    <text x="443" y="308" font-size="16" font-weight="700" class="muted">Offline mode</text>

    <text x="409" y="365" class="title ink">Moving materials</text>
    <text x="409" y="394" class="body muted">Cell systems · Section 2 of 3</text>
    <rect x="409" y="420" width="242" height="9" rx="4.5" fill="#E7E9F2"/>
    <rect x="409" y="420" width="148" height="9" rx="4.5" fill="#7184FF"/>
    <text x="409" y="450" class="small muted">61% of lesson complete</text>

    <rect x="409" y="476" width="242" height="115" rx="18" fill="#EEF1FF"/>
    <circle cx="433" cy="504" r="12" fill="#7184FF"/>
    <path d="M428 504l4 4 7-9" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <text x="455" y="510" font-size="17" font-weight="700" class="ink">Everything is saved here</text>
    <text x="429" y="541" class="small muted">Read, highlight and take the</text>
    <text x="429" y="565" class="small muted">quiz without a connection.</text>

    <rect x="409" y="615" width="242" height="58" rx="16" fill="#30358F"/>
    <path d="M432 643l7 7 13-16" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="463" y="651" font-size="17" font-weight="700" class="white">Mark section complete</text>
    <text x="530" y="694" text-anchor="middle" font-size="13" font-weight="700" class="brand">56 PX · LABEL + ICON</text>

    <rect x="409" y="716" width="242" height="92" rx="18" fill="#FFF7E3"/>
    <text x="429" y="745" font-size="19" font-weight="700" fill="#725A1C">3 changes on this device</text>
    <text x="429" y="772" class="small" fill="#725A1C">Saved locally · Not uploaded</text>
    <text x="429" y="795" class="small" fill="#725A1C">Sync when you are online.</text>
    <rect x="485" y="826" width="90" height="5" rx="2.5" fill="#30358F"/>
  </g>

  <!-- Arrow 2 -->
  <g aria-label="Next step">
    <circle cx="693" cy="531" r="16" fill="#B9E4CE"/>
    <path d="M686 531h13m-5-5 5 5-5 5" fill="none" stroke="#30358F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sync changes -->
  <g aria-label="Sync changes mobile screen">
    <rect x="710" y="230" width="290" height="620" rx="30" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="734" y="264" font-size="15" font-weight="700" class="ink">9:41</text>
    <path d="M946 258h6v6h-6zM956 255h6v9h-6zM966 252h6v12h-6z" fill="#30358F"/>
    <text x="734" y="314" class="title ink">Sync center</text>
    <rect x="734" y="334" width="242" height="38" rx="19" fill="#E7F6EE"/>
    <circle cx="754" cy="353" r="5" fill="#398369"/>
    <text x="767" y="359" font-size="16" font-weight="700" fill="#2F6C55">Online · Ready to sync</text>

    <rect x="734" y="399" width="242" height="121" rx="20" fill="#EEF1FF"/>
    <text x="754" y="447" font-size="38" font-weight="700" class="brand">3 changes</text>
    <text x="754" y="475" font-size="18" font-weight="700" class="ink">saved on this device</text>
    <text x="754" y="502" class="small muted">Waiting to be uploaded</text>

    <text x="734" y="561" font-size="19" font-weight="700" class="ink">Pending sync</text>
    <g font-size="16" class="muted">
      <circle cx="743" cy="590" r="4" fill="#7184FF"/>
      <text x="757" y="596">2 quiz responses</text>
      <circle cx="743" cy="621" r="4" fill="#7184FF"/>
      <text x="757" y="627">1 highlight note</text>
    </g>

    <rect x="734" y="651" width="242" height="58" rx="16" fill="#30358F"/>
    <path d="M753 678a8 8 0 0 1 13-6m0 0v6m0-6h-6M768 686a8 8 0 0 1-13 6m0 0v-6m0 6h6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="784" y="687" font-size="18" font-weight="700" class="white">Sync 3 changes now</text>

    <rect x="734" y="735" width="242" height="75" rx="16" fill="#F7F8FC" stroke="#DFE3F5"/>
    <text x="754" y="762" font-size="16" font-weight="700" class="ink">After a successful sync</text>
    <text x="754" y="786" class="small" fill="#2F6C55">“All changes uploaded”</text>
    <text x="855" y="833" text-anchor="middle" font-size="14" class="muted">Keep work available offline</text>
  </g>

  <!-- State matrix -->
  <g aria-label="Online offline and syncing state matrix">
    <rect x="1040" y="230" width="340" height="620" rx="28" fill="#FFFFFF" filter="url(#shadow)"/>
    <text x="1064" y="273" font-size="24" font-weight="700" class="ink">State matrix</text>
    <text x="1064" y="300" class="small muted">Message first; colour supports meaning.</text>
    <text x="1064" y="340" class="label muted">STATE</text>
    <text x="1165" y="340" class="label muted">SCREEN MESSAGE / ACTION</text>
    <line x1="1064" y1="354" x2="1356" y2="354" stroke="#DFE3F5"/>

    <rect x="1064" y="370" width="82" height="28" rx="14" fill="#E7F6EE"/>
    <text x="1105" y="389" text-anchor="middle" font-size="14" font-weight="700" fill="#2F6C55">Online</text>
    <text x="1165" y="383" font-size="16" font-weight="700" class="ink">Ready to sync</text>
    <text x="1165" y="407" font-size="15" class="muted">Show pending count.</text>
    <text x="1165" y="430" font-size="15" class="muted">Enable “Sync now”.</text>
    <line x1="1064" y1="450" x2="1356" y2="450" stroke="#E8EAF3"/>

    <rect x="1064" y="468" width="82" height="28" rx="14" fill="#F1F2F6"/>
    <text x="1105" y="487" text-anchor="middle" font-size="14" font-weight="700" class="muted">Offline</text>
    <text x="1165" y="481" font-size="16" font-weight="700" class="ink">Saved on this device</text>
    <text x="1165" y="505" font-size="15" class="muted">Keep downloaded work open.</text>
    <text x="1165" y="528" font-size="15" class="muted">Never say “Synced”.</text>
    <line x1="1064" y1="548" x2="1356" y2="548" stroke="#E8EAF3"/>

    <rect x="1064" y="566" width="82" height="28" rx="14" fill="#EEF1FF"/>
    <text x="1105" y="585" text-anchor="middle" font-size="14" font-weight="700" class="brand">Syncing</text>
    <text x="1165" y="579" font-size="16" font-weight="700" class="ink">Uploading changes…</text>
    <text x="1165" y="603" font-size="15" class="muted">Show progress and cancel.</text>
    <text x="1165" y="626" font-size="15" class="muted">Confirm only on success.</text>

    <rect x="1064" y="655" width="292" height="1" fill="#DFE3F5"/>
    <text x="1064" y="688" font-size="19" font-weight="700" class="ink">Accessible interaction</text>
    <rect x="1064" y="707" width="292" height="42" rx="12" fill="#EEF1FF"/>
    <text x="1080" y="734" font-size="16" font-weight="700" class="brand">Primary action · 56 px high</text>
    <rect x="1064" y="757" width="292" height="38" rx="12" fill="#F7F8FC"/>
    <text x="1080" y="782" font-size="16" class="ink">Secondary action · 48 px high</text>
    <text x="1064" y="821" font-size="15" class="muted">Visible focus, icon and plain-language text.</text>
  </g>

  <g aria-label="Flow principle">
    <rect x="60" y="884" width="1320" height="42" rx="21" fill="#30358F"/>
    <text x="80" y="911" font-size="17" font-weight="700" class="white">OFFLINE-FIRST PRINCIPLE</text>
    <text x="336" y="911" font-size="17" fill="#EEF1FF">Local saving is immediate; uploading is a separate, explicit state.</text>
    <text x="1358" y="911" text-anchor="end" font-size="15" fill="#B9E4CE">Illustrative course activity</text>
  </g>
</svg>
