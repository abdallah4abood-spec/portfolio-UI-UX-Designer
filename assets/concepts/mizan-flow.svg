<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="title desc">
  <title id="title">Mizan baseline and cautious scenario planner — concept flow</title>
  <desc id="desc">Concept design visualization of a detailed scenario planner comparing baseline and cautious months, with an adjustable assumed income control, committed and flexible cost breakdowns, and a plain-language explanation that the scenarios are not forecasts or financial advice.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#35284D" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .aub { fill: #35284D; }
      .violet { fill: #7563D8; }
      .muted { fill: #746D80; }
      .white { fill: #FFFFFF; }
      .label { font-size: 15px; font-weight: 700; letter-spacing: 1.4px; }
      .small { font-size: 16px; }
      .body { font-size: 19px; }
      .semibold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F6F3FA"/>
  <circle cx="1375" cy="92" r="160" fill="#F0EDF8"/>
  <path d="M0 872c165-45 290-24 420 88H0z" fill="#C9E8D1" opacity="0.30"/>

  <g aria-label="Proof sheet heading">
    <rect x="60" y="40" width="52" height="52" rx="16" fill="#35284D"/>
    <path d="M73 75h28M77 63h20M82 52h10M85 52v23" fill="none" stroke="#C9E8D1" stroke-width="3" stroke-linecap="round"/>
    <text x="128" y="59" class="label violet">MIZAN / SCENARIO PLANNER</text>
    <text x="128" y="100" font-size="34" font-weight="700" class="aub">Change the assumption. See the arithmetic. Keep the uncertainty visible.</text>
    <rect x="1110" y="20" width="270" height="38" rx="19" fill="#35284D"/>
    <text x="1245" y="44" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" class="white">CONCEPT · ILLUSTRATIVE DATA</text>
    <text x="60" y="139" font-size="19" class="muted">A cautious month is a user-controlled input, not a prediction about future income.</text>
  </g>

  <text x="60" y="190" class="label violet">SCENARIO COMPARISON · ILLUSTRATIVE GBP AMOUNTS</text>
  <text x="1380" y="190" text-anchor="end" font-size="17" font-weight="700" class="aub">Values are illustrative · Not financial advice</text>

  <!-- Scenario planner application -->
  <g aria-label="Detailed scenario planner">
    <rect x="60" y="210" width="1320" height="675" rx="26" fill="#FFFFFF" filter="url(#shadow)"/>
    <path d="M60 236a26 26 0 0 1 26-26h1268a26 26 0 0 1 26 26v42H60z" fill="#35284D"/>
    <text x="88" y="255" font-size="26" font-weight="700" class="white">mizan</text>
    <circle cx="177" cy="245" r="5" fill="#C9E8D1"/>
    <text x="215" y="251" font-size="16" fill="#DCD5EA">Scenario planner</text>
    <text x="1190" y="251" text-anchor="end" font-size="16" fill="#DCD5EA">October draft</text>
    <rect x="1210" y="228" width="142" height="32" rx="16" fill="#4A3A65"/>
    <text x="1281" y="249" text-anchor="middle" font-size="14" font-weight="700" class="white">Save plan notes</text>

    <text x="88" y="323" font-size="29" font-weight="700" class="aub">Compare baseline and cautious months</text>
    <text x="88" y="347" font-size="16" class="muted">The same committed costs are used in both scenarios. Only the labelled assumptions change.</text>

    <!-- Assumption controls -->
    <rect x="88" y="373" width="382" height="451" rx="20" fill="#F8F6FB" stroke="#E0DAEA"/>
    <circle cx="118" cy="407" r="15" fill="#7563D8"/>
    <text x="118" y="413" text-anchor="middle" font-size="15" font-weight="700" class="white">1</text>
    <text x="145" y="414" font-size="21" font-weight="700" class="aub">Set assumed income</text>
    <text x="112" y="449" font-size="16" class="muted">Editing the cautious month only</text>

    <rect x="112" y="475" width="334" height="42" rx="12" fill="#E9E4F2"/>
    <rect x="283" y="475" width="163" height="42" rx="12" fill="#7563D8"/>
    <text x="197" y="502" text-anchor="middle" font-size="15" font-weight="700" class="muted">Baseline month</text>
    <text x="364" y="502" text-anchor="middle" font-size="15" font-weight="700" class="white">Cautious month</text>

    <text x="112" y="558" font-size="16" font-weight="700" class="muted">ASSUMED INCOME</text>
    <text x="112" y="608" font-size="42" font-weight="700" class="aub">£2,100</text>
    <text x="446" y="605" text-anchor="end" font-size="15" class="muted">per month</text>

    <rect x="112" y="641" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#BFB5D2" stroke-width="2"/>
    <text x="136" y="673" text-anchor="middle" font-size="27" font-weight="700" class="violet">−</text>
    <rect x="398" y="641" width="48" height="48" rx="12" fill="#FFFFFF" stroke="#BFB5D2" stroke-width="2"/>
    <text x="422" y="672" text-anchor="middle" font-size="26" font-weight="700" class="violet">+</text>
    <rect x="176" y="662" width="206" height="8" rx="4" fill="#DCD5E8"/>
    <rect x="176" y="662" width="65" height="8" rx="4" fill="#7563D8"/>
    <circle cx="241" cy="666" r="15" fill="#FFFFFF" stroke="#7563D8" stroke-width="5"/>
    <text x="176" y="710" font-size="14" class="muted">£1,600</text>
    <text x="382" y="710" text-anchor="end" font-size="14" class="muted">£3,200</text>
    <text x="279" y="736" text-anchor="middle" font-size="14" class="muted">£100 steps · 48 px buttons</text>

    <rect x="112" y="758" width="334" height="42" rx="12" fill="#F0EDF8"/>
    <text x="279" y="785" text-anchor="middle" font-size="16" font-weight="700" class="violet">Reset cautious income to £2,100</text>

    <!-- Baseline card -->
    <rect x="494" y="373" width="244" height="451" rx="20" fill="#FFFFFF" stroke="#D8D0E4" stroke-width="2"/>
    <rect x="494" y="373" width="244" height="52" rx="20" fill="#F0EDF8"/>
    <rect x="494" y="405" width="244" height="20" fill="#F0EDF8"/>
    <text x="516" y="407" font-size="20" font-weight="700" class="aub">Baseline month</text>
    <text x="516" y="457" class="label muted">ASSUMED INCOME</text>
    <text x="516" y="492" font-size="31" font-weight="700" class="aub">£2,600</text>
    <line x1="516" y1="511" x2="716" y2="511" stroke="#E2DCE9"/>

    <text x="516" y="541" font-size="16" font-weight="700" class="aub">Committed costs</text>
    <text x="716" y="541" text-anchor="end" font-size="17" font-weight="700" class="aub">£1,360</text>
    <text x="516" y="568" font-size="14" class="muted">Rent £820 · Utilities £180</text>
    <text x="516" y="590" font-size="14" class="muted">Tax set-aside £360</text>
    <rect x="516" y="606" width="200" height="10" rx="5" fill="#E7E1ED"/>
    <rect x="516" y="606" width="200" height="10" rx="5" fill="#35284D"/>

    <text x="516" y="650" font-size="16" font-weight="700" class="aub">Flexible costs</text>
    <text x="716" y="650" text-anchor="end" font-size="17" font-weight="700" class="aub">£420</text>
    <text x="516" y="677" font-size="14" class="muted">Food £260 · Transport £80</text>
    <text x="516" y="699" font-size="14" class="muted">Other £80</text>
    <rect x="516" y="715" width="200" height="10" rx="5" fill="#E7E1ED"/>
    <rect x="516" y="715" width="84" height="10" rx="5" fill="#7563D8"/>

    <rect x="510" y="749" width="212" height="57" rx="14" fill="#C9E8D1"/>
    <text x="526" y="771" font-size="13" font-weight="700" fill="#315B49">AFTER ALL LISTED COSTS</text>
    <text x="526" y="796" font-size="24" font-weight="700" fill="#274A3D">£820</text>
    <text x="704" y="794" text-anchor="end" font-size="13" fill="#315B49">remaining</text>

    <!-- Cautious card -->
    <rect x="754" y="373" width="244" height="451" rx="20" fill="#FFFFFF" stroke="#7563D8" stroke-width="2"/>
    <rect x="754" y="373" width="244" height="52" rx="20" fill="#7563D8"/>
    <rect x="754" y="405" width="244" height="20" fill="#7563D8"/>
    <text x="776" y="407" font-size="20" font-weight="700" class="white">Cautious month</text>
    <text x="776" y="457" class="label violet">ASSUMED INCOME · EDITED</text>
    <text x="776" y="492" font-size="31" font-weight="700" class="aub">£2,100</text>
    <line x1="776" y1="511" x2="976" y2="511" stroke="#E2DCE9"/>

    <text x="776" y="541" font-size="16" font-weight="700" class="aub">Committed costs</text>
    <text x="976" y="541" text-anchor="end" font-size="17" font-weight="700" class="aub">£1,360</text>
    <text x="776" y="568" font-size="14" class="muted">Same items as baseline</text>
    <text x="776" y="590" font-size="14" class="muted">No change in this scenario</text>
    <rect x="776" y="606" width="200" height="10" rx="5" fill="#E7E1ED"/>
    <rect x="776" y="606" width="200" height="10" rx="5" fill="#35284D"/>

    <text x="776" y="650" font-size="16" font-weight="700" class="aub">Flexible costs</text>
    <text x="976" y="650" text-anchor="end" font-size="17" font-weight="700" class="aub">£320</text>
    <text x="776" y="677" font-size="14" class="muted">Food £220 · Transport £60</text>
    <text x="776" y="699" font-size="14" class="muted">Other £40</text>
    <rect x="776" y="715" width="200" height="10" rx="5" fill="#E7E1ED"/>
    <rect x="776" y="715" width="64" height="10" rx="5" fill="#7563D8"/>

    <rect x="770" y="749" width="212" height="57" rx="14" fill="#C9E8D1"/>
    <text x="786" y="771" font-size="13" font-weight="700" fill="#315B49">AFTER ALL LISTED COSTS</text>
    <text x="786" y="796" font-size="24" font-weight="700" fill="#274A3D">£420</text>
    <text x="964" y="794" text-anchor="end" font-size="13" fill="#315B49">remaining</text>

    <!-- Explanation -->
    <rect x="1022" y="373" width="330" height="451" rx="20" fill="#35284D"/>
    <circle cx="1052" cy="407" r="15" fill="#C9E8D1"/>
    <text x="1052" y="413" text-anchor="middle" font-size="15" font-weight="700" class="aub">2</text>
    <text x="1079" y="414" font-size="21" font-weight="700" class="white">How to read this</text>
    <text x="1048" y="459" font-size="18" fill="#F0EDF8">A scenario is a set of “what if”</text>
    <text x="1048" y="485" font-size="18" fill="#F0EDF8">inputs you can inspect and edit.</text>
    <line x1="1048" y1="509" x2="1326" y2="509" stroke="#59476F"/>

    <circle cx="1056" cy="541" r="5" fill="#C9E8D1"/>
    <text x="1072" y="547" font-size="16" fill="#FFFFFF">Committed costs stay fixed</text>
    <text x="1072" y="570" font-size="15" fill="#DCD5EA">so the comparison is understandable.</text>

    <circle cx="1056" cy="608" r="5" fill="#C9E8D1"/>
    <text x="1072" y="614" font-size="16" fill="#FFFFFF">Cautious means lower assumed</text>
    <text x="1072" y="637" font-size="15" fill="#DCD5EA">income and less flexible spending.</text>

    <circle cx="1056" cy="675" r="5" fill="#C9E8D1"/>
    <text x="1072" y="681" font-size="16" fill="#FFFFFF">The remainder is subtraction,</text>
    <text x="1072" y="704" font-size="15" fill="#DCD5EA">not an expected account balance.</text>

    <rect x="1048" y="733" width="278" height="67" rx="14" fill="#4A3A65"/>
    <text x="1064" y="758" font-size="13" font-weight="700" fill="#C9E8D1">NOT A FORECAST OR FINANCIAL ADVICE</text>
    <text x="1064" y="781" font-size="14" fill="#F0EDF8">Actual income and costs may differ.</text>

    <rect x="88" y="846" width="1264" height="1" fill="#E5DFEB"/>
    <g aria-label="Cost colour legend">
      <rect x="88" y="860" width="12" height="12" rx="3" fill="#35284D"/>
      <text x="108" y="871" font-size="14" class="muted">Committed costs</text>
      <rect x="244" y="860" width="12" height="12" rx="3" fill="#7563D8"/>
      <text x="264" y="871" font-size="14" class="muted">Flexible costs</text>
      <rect x="385" y="860" width="12" height="12" rx="3" fill="#C9E8D1"/>
      <text x="405" y="871" font-size="14" class="muted">Remaining after listed costs</text>
    </g>
    <text x="1352" y="871" text-anchor="end" font-size="14" class="muted">Arithmetic: £2,100 − £1,360 − £320 = £420</text>
  </g>

  <text x="60" y="928" font-size="17" class="muted">All scenario values are illustrative and editable; no future result is predicted or guaranteed.</text>
  <text x="1380" y="928" text-anchor="end" font-size="17" font-weight="700" class="violet">MIZAN / SCENARIO FLOW</text>
</svg>
