<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" width="1440" height="960" role="img" aria-labelledby="title desc">
  <title id="title">Masar offline-first study planner — concept overview</title>
  <desc id="desc">Concept design visualization showing three coordinated mobile screens: a weekly study plan with downloaded lessons, an offline-ready lesson detail, and a sync center with three changes saved on the device.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#30358F" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .ink { fill: #242756; }
      .muted { fill: #686B87; }
      .brand { fill: #30358F; }
      .white { fill: #FFFFFF; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: 1.6px; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .screen-title { font-size: 30px; font-weight: 700; }
      .semibold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="#F7F8FC"/>
  <circle cx="1370" cy="105" r="165" fill="#EEF1FF"/>
  <circle cx="36" cy="900" r="120" fill="#B9E4CE" opacity="0.35"/>

  <g aria-label="Proof sheet heading">
    <rect x="60" y="42" width="54" height="54" rx="16" fill="#30358F"/>
    <path d="M75 79V59l12 11 12-11v20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="130" y="62" class="label brand">MASAR / OFFLINE-FIRST STUDY</text>
    <text x="130" y="94" font-size="28" font-weight="700" class="ink">A plan that stays useful without a connection</text>
    <rect x="1110" y="48" width="270" height="38" rx="19" fill="#30358F"/>
    <text x="1245" y="72" text-anchor="middle" font-size="15" font-weight="700" letter-spacing="1.1" class="white">CONCEPT · ILLUSTRATIVE DATA</text>
    <text x="60" y="139" font-size="22" class="muted">Three connected moments: prepare, learn offline, then sync deliberately.</text>
  </g>

  <g aria-label="Screen labels">
    <text x="80" y="184" class="label brand">01 · THIS WEEK</text>
    <text x="550" y="184" class="label brand">02 · LESSON DETAIL</text>
    <text x="1020" y="184" class="label brand">03 · SYNC CENTER</text>
  </g>

  <!-- This week -->
  <g aria-label="This week mobile screen">
    <rect x="80" y="205" width="340" height="680" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="80" y="205" width="340" height="6" rx="3" fill="#7184FF"/>
    <text x="105" y="239" font-size="16" font-weight="700" class="ink">9:41</text>
    <path d="M360 232h7v7h-7zM371 229h7v10h-7zM382 226h7v13h-7z" fill="#30358F"/>
    <text x="104" y="283" class="screen-title ink">This week</text>
    <rect x="292" y="255" width="104" height="34" rx="17" fill="#EEF1FF"/>
    <circle cx="310" cy="272" r="5" fill="#7184FF"/>
    <text x="322" y="278" font-size="15" font-weight="700" class="brand">6 lessons</text>

    <rect x="104" y="310" width="292" height="136" rx="22" fill="#30358F"/>
    <text x="126" y="342" font-size="17" fill="#DDE2FF">WEEKLY PROGRESS</text>
    <text x="126" y="382" font-size="32" font-weight="700" class="white">4 of 6 complete</text>
    <rect x="126" y="405" width="248" height="10" rx="5" fill="#5157AB"/>
    <rect x="126" y="405" width="165" height="10" rx="5" fill="#B9E4CE"/>
    <text x="126" y="434" font-size="15" fill="#EEF1FF">Two lessons left in this plan</text>

    <text x="104" y="486" font-size="21" font-weight="700" class="ink">Downloaded lessons</text>
    <text x="396" y="486" text-anchor="end" font-size="16" font-weight="700" class="brand">View all</text>

    <rect x="104" y="505" width="292" height="98" rx="18" fill="#EEF1FF"/>
    <rect x="118" y="520" width="46" height="46" rx="14" fill="#7184FF"/>
    <path d="M131 543l8 8 14-17" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="178" y="532" font-size="16" font-weight="700" class="brand">BIOLOGY</text>
    <text x="178" y="556" font-size="20" font-weight="700" class="ink">Cell systems</text>
    <text x="178" y="582" font-size="16" class="muted">18 min · Downloaded</text>
    <path d="M366 526v24m-6-6 6 6 6-6" fill="none" stroke="#30358F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="104" y="615" width="292" height="98" rx="18" fill="#FFFFFF" stroke="#DFE3F5" stroke-width="2"/>
    <rect x="118" y="630" width="46" height="46" rx="14" fill="#B9E4CE"/>
    <path d="M130 653h22m-18-8h14m-11 16h10" fill="none" stroke="#30358F" stroke-width="3" stroke-linecap="round"/>
    <text x="178" y="642" font-size="16" font-weight="700" class="brand">ALGEBRA</text>
    <text x="178" y="666" font-size="20" font-weight="700" class="ink">Linear equations</text>
    <rect x="178" y="684" width="136" height="7" rx="3.5" fill="#E4E7F2"/>
    <rect x="178" y="684" width="68" height="7" rx="3.5" fill="#7184FF"/>
    <text x="378" y="693" text-anchor="end" font-size="15" class="muted">50%</text>

    <rect x="104" y="725" width="292" height="86" rx="18" fill="#FFFFFF" stroke="#DFE3F5" stroke-width="2"/>
    <circle cx="141" cy="754" r="23" fill="#EEE9DF"/>
    <path d="M132 754h18m-9-9v18" stroke="#30358F" stroke-width="2.5" stroke-linecap="round"/>
    <text x="178" y="753" font-size="16" font-weight="700" class="brand">MODERN HISTORY</text>
    <text x="178" y="778" font-size="19" font-weight="700" class="ink">Industrial change</text>
    <text x="178" y="800" font-size="15" class="muted">22 min · Downloaded</text>

    <line x1="104" y1="832" x2="396" y2="832" stroke="#E8EAF3"/>
    <path d="M137 850l10-9 10 9v11h-20z" fill="#30358F"/>
    <text x="147" y="876" text-anchor="middle" font-size="14" font-weight="700" class="brand">Plan</text>
    <path d="M238 843h20v18h-20zM242 839h12" fill="none" stroke="#8B8EA3" stroke-width="2"/>
    <text x="248" y="876" text-anchor="middle" font-size="14" class="muted">Library</text>
    <path d="M345 842a10 10 0 1 0 0.1M335 859a15 15 0 0 1 20 0" fill="none" stroke="#8B8EA3" stroke-width="2"/>
    <text x="345" y="876" text-anchor="middle" font-size="14" class="muted">You</text>
  </g>

  <!-- Lesson detail -->
  <g aria-label="Downloaded lesson detail mobile screen">
    <rect x="550" y="205" width="340" height="680" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="550" y="205" width="340" height="6" rx="3" fill="#B9E4CE"/>
    <text x="575" y="239" font-size="16" font-weight="700" class="ink">9:41</text>
    <path d="M830 232h7v7h-7zM841 229h7v10h-7zM852 226h7v13h-7z" fill="#30358F"/>
    <circle cx="593" cy="277" r="22" fill="#EEF1FF"/>
    <path d="M598 266l-10 11 10 11" fill="none" stroke="#30358F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="866" y="284" text-anchor="end" font-size="17" font-weight="700" class="brand">Lesson 3 of 6</text>
    <text x="574" y="337" font-size="18" font-weight="700" class="brand">BIOLOGY · 18 MIN</text>
    <text x="574" y="376" font-size="34" font-weight="700" class="ink">Cell systems</text>
    <text x="574" y="407" class="body muted">Structure, function and transport</text>

    <rect x="574" y="436" width="292" height="104" rx="20" fill="#E7F6EE"/>
    <circle cx="604" cy="468" r="16" fill="#B9E4CE"/>
    <path d="M596 468l6 6 11-13" fill="none" stroke="#245D47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="632" y="475" font-size="21" font-weight="700" fill="#245D47">Available offline</text>
    <text x="596" y="509" font-size="17" fill="#386C5C">Lesson, notes and quiz saved</text>
    <text x="596" y="530" font-size="15" fill="#386C5C">24 MB on this device</text>

    <text x="574" y="582" font-size="20" font-weight="700" class="ink">Your progress</text>
    <text x="866" y="582" text-anchor="end" font-size="20" font-weight="700" class="brand">62%</text>
    <rect x="574" y="600" width="292" height="10" rx="5" fill="#E8EAF3"/>
    <rect x="574" y="600" width="181" height="10" rx="5" fill="#7184FF"/>
    <text x="574" y="637" font-size="17" class="muted">Resume at “Moving materials”</text>

    <rect x="574" y="661" width="292" height="58" rx="16" fill="#30358F"/>
    <path d="M613 680l12 10-12 10z" fill="#FFFFFF"/>
    <text x="641" y="698" font-size="21" font-weight="700" class="white">Continue lesson</text>

    <text x="574" y="762" font-size="20" font-weight="700" class="ink">Saved for offline use</text>
    <g font-size="17" class="muted">
      <circle cx="585" cy="792" r="5" fill="#7184FF"/>
      <text x="601" y="798">Reading and diagrams</text>
      <circle cx="585" cy="824" r="5" fill="#7184FF"/>
      <text x="601" y="830">Five-question quiz</text>
    </g>
    <rect x="695" y="858" width="50" height="5" rx="2.5" fill="#30358F"/>
  </g>

  <!-- Sync center -->
  <g aria-label="Sync center mobile screen">
    <rect x="1020" y="205" width="340" height="680" rx="32" fill="#FFFFFF" filter="url(#shadow)"/>
    <rect x="1020" y="205" width="340" height="6" rx="3" fill="#7184FF"/>
    <text x="1045" y="239" font-size="16" font-weight="700" class="ink">9:41</text>
    <path d="M1300 232h7v7h-7zM1311 229h7v10h-7zM1322 226h7v13h-7z" fill="#30358F"/>
    <text x="1044" y="287" class="screen-title ink">Sync center</text>
    <rect x="1044" y="306" width="292" height="38" rx="19" fill="#F1F2F6"/>
    <circle cx="1064" cy="325" r="5" fill="#8B8EA3"/>
    <text x="1078" y="331" font-size="16" font-weight="700" class="muted">You are offline</text>

    <rect x="1044" y="366" width="292" height="146" rx="22" fill="#EEF1FF"/>
    <text x="1068" y="425" font-size="52" font-weight="700" class="brand">3</text>
    <text x="1125" y="405" font-size="21" font-weight="700" class="ink">changes saved</text>
    <text x="1125" y="434" font-size="21" font-weight="700" class="ink">on this device</text>
    <text x="1068" y="474" font-size="17" class="muted">Not uploaded yet</text>
    <rect x="1068" y="487" width="113" height="24" rx="12" fill="#FFF3D6"/>
    <text x="1124" y="504" text-anchor="middle" font-size="13" font-weight="700" fill="#745B16">PENDING SYNC</text>

    <text x="1044" y="553" font-size="20" font-weight="700" class="ink">Waiting to sync</text>
    <g>
      <rect x="1044" y="572" width="292" height="58" rx="14" fill="#FFFFFF" stroke="#E1E4F0"/>
      <circle cx="1069" cy="601" r="12" fill="#EEF1FF"/>
      <path d="M1064 601l4 4 7-9" fill="none" stroke="#30358F" stroke-width="2"/>
      <text x="1092" y="596" font-size="17" font-weight="700" class="ink">Quiz response</text>
      <text x="1092" y="617" font-size="14" class="muted">Cell systems</text>
      <text x="1320" y="606" text-anchor="end" font-size="14" font-weight="700" fill="#8A6B1F">Pending</text>
    </g>
    <g>
      <rect x="1044" y="638" width="292" height="58" rx="14" fill="#FFFFFF" stroke="#E1E4F0"/>
      <circle cx="1069" cy="667" r="12" fill="#EEF1FF"/>
      <path d="M1064 667l4 4 7-9" fill="none" stroke="#30358F" stroke-width="2"/>
      <text x="1092" y="662" font-size="17" font-weight="700" class="ink">Quiz response</text>
      <text x="1092" y="683" font-size="14" class="muted">Linear equations</text>
      <text x="1320" y="672" text-anchor="end" font-size="14" font-weight="700" fill="#8A6B1F">Pending</text>
    </g>
    <g>
      <rect x="1044" y="704" width="292" height="58" rx="14" fill="#FFFFFF" stroke="#E1E4F0"/>
      <circle cx="1069" cy="733" r="12" fill="#EEF1FF"/>
      <path d="M1064 728h10m-10 6h10m-10 6h7" stroke="#30358F" stroke-width="1.8" stroke-linecap="round"/>
      <text x="1092" y="728" font-size="17" font-weight="700" class="ink">Highlight note</text>
      <text x="1092" y="749" font-size="14" class="muted">Industrial change</text>
      <text x="1320" y="738" text-anchor="end" font-size="14" font-weight="700" fill="#8A6B1F">Pending</text>
    </g>

    <rect x="1044" y="784" width="292" height="56" rx="16" fill="#30358F"/>
    <path d="M1080 806a9 9 0 0 1 15-7m0 0v7m0-7h-7M1097 818a9 9 0 0 1-15 7m0 0v-7m0 7h7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1110" y="819" font-size="18" font-weight="700" class="white">Connect to sync changes</text>
    <text x="1190" y="865" text-anchor="middle" font-size="14" class="muted">Last synced: yesterday, 18:20</text>
  </g>

  <text x="60" y="930" font-size="17" class="muted">Interface proof sheet · Course names, progress and sync activity are illustrative.</text>
  <text x="1380" y="930" text-anchor="end" font-size="17" font-weight="700" class="brand">MASAR / OVERVIEW</text>
</svg>
